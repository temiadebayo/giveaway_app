name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        # Warnings are tolerated; errors are not. --max-warnings is deliberately not set
        # yet: there are ~129 pre-existing warnings (mostly `any` at Supabase boundaries).
        # Once those are burned down, pin this to --max-warnings=0 so the count can only
        # go down.
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders. The app reads these at module scope, so the build
          # needs them present — it never connects to Supabase during a build.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          # Skip Sentry source map upload; no auth token on CI.
          SENTRY_AUTH_TOKEN: ""

  sql-guardrails:
    name: SQL guardrails
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Static checks on the migration set. These encode the two mistakes that actually
      # bit us during Phase 0, so they cannot recur silently.
      # Matches the `security definer` DECLARATION (on its own line, per house style) and
      # requires the next non-blank line to pin search_path. Comments are stripped first.
      #
      # A naive `grep -c 'security definer'` was tried and rejected: it fires on the phrase
      # appearing inside `comment on ... is '...'` strings and in explanatory prose, and a
      # check that reports false positives is a check someone eventually deletes.
      #
      # This is a fast pre-flight, not the authority. The authoritative test queries
      # pg_proc.proconfig against the live database — see the P0-3 assertions in
      # supabase/migrations/20260802120500_phase0_verify.sql, which must be run after
      # applying migrations.
      - name: Every security definer function pins search_path
        run: |
          set -euo pipefail
          failed=0
          for f in supabase/migrations/*.sql; do
            unpinned=$(sed 's/--.*//' "$f" | awk '
              BEGIN { IGNORECASE = 1 }
              /^[[:space:]]*security[[:space:]]+definer[[:space:]]*$/ { pending = 1; next }
              pending == 1 && /^[[:space:]]*$/ { next }
              pending == 1 {
                if ($0 !~ /set[[:space:]]+search_path/) count++
                pending = 0
              }
              END { print count + 0 }
            ')
            if [ "$unpinned" -gt 0 ]; then
              echo "::error file=$f::$unpinned security definer function(s) do not pin search_path. An unpinned function resolves unqualified names using the CALLER's search_path, so a caller who can create objects in an earlier schema can shadow a table and have the function operate on it with the owner's privileges."
              failed=1
            fi
          done
          exit $failed

      # Comments are stripped first: the migrations quote the old vulnerable grants in
      # prose to explain what they fixed, and matching that text is a false positive.
      - name: No blanket grants to anon or authenticated
        run: |
          set -euo pipefail
          failed=0
          for f in supabase/migrations/*.sql; do
            if sed 's/--.*//' "$f" \
               | grep -niE 'grant +all +on +(table +)?public\.' \
               | grep -viE 'to +(postgres, *)?service_role *;' ; then
              echo "::error file=$f::'grant all on public.<table>' to a client role is what produced the original vulnerabilities. Grant specific privileges, or specific columns."
              failed=1
            fi
          done
          exit $failed

      - name: Legacy fix_*.sql files are not modified
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'supabase/*.sql' || true)
          if [ -n "$changed" ]; then
            echo "::error::$changed — the loose supabase/*.sql files are legacy and must not be edited or re-applied. Add a migration under supabase/migrations/ instead."
            exit 1
          fi
